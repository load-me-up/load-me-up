<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glitch</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #181a1f;
    --card: #1e2026;
    --line: #2c2f36;
    --text: #e7e8ec;
    --muted: #9b9ea8;
    --accent: #8d7dff;
    --warn: #e0a050;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: #2a2d34;
    border: 1px solid #3a3e48;
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover { border-color: #5c6170; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #3a3270; border-color: #6a5ad4; }
  .main { flex: 1; display: flex; min-height: 0; }
  .preview {
    flex: 1;
    min-width: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .preview.over { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .stage { position: relative; width: fit-content; max-width: 100%; max-height: 100%; }
  #view {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 96px);
    background: #08090b;
    border-radius: 4px;
  }
  #crop {
    position: absolute;
    border: 1px solid #fff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
    cursor: grab;
    touch-action: none;
  }
  #crop:active { cursor: grabbing; }
  #crop[hidden] { display: none; }
  #hint {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--muted);
    pointer-events: none;
  }
  #hint[hidden] { display: none; }
  #hint button { pointer-events: auto; }
  #originalBtn {
    position: absolute;
    left: 16px;
    bottom: 16px;
  }
  #originalBtn.on { border-color: var(--accent); color: #fff; }
  .side {
    width: 332px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow: auto;
    padding: 12px;
  }
  .group { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row + .row, .field { margin-top: 8px; }
  .field { display: grid; grid-template-columns: 72px 1fr auto; gap: 6px; align-items: center; }
  .field span, .muted { color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="number"], input[type="text"], select {
    background: #121318;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 6px;
  }
  input[type="number"] { width: 100%; }
  #seedInput { width: 9em; }
  .layer {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
    padding: 6px 8px;
  }
  .layer.dragging { opacity: 0.55; }
  .layer-h { display: flex; align-items: center; gap: 6px; }
  .layer-h .name { flex: 1; display: flex; align-items: center; gap: 6px; }
  .handle {
    cursor: grab;
    touch-action: none;
    padding: 2px 4px;
    background: transparent;
    border: 0;
    color: var(--muted);
    letter-spacing: -1px;
  }
  .anim { color: var(--muted); display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .body { margin-top: 6px; }
  .layer:not(.on):not(.texture) .body { display: none; }
  .tex-name { color: var(--muted); font-size: 12px; word-break: break-all; }
  footer {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-top: 1px solid var(--line);
    background: #14161a;
  }
  footer .spacer { flex: 1; }
  #gifEst.warn { color: var(--warn); }
  #status { color: var(--muted); min-width: 8em; }
  #status.warn { color: var(--warn); }
  .keys { color: var(--muted); font-size: 11px; }
  #sink, #vid { position: fixed; left: -8000px; top: 0; width: 2px; height: 2px; }
</style>
</head>
<body>
<div class="main">
  <div class="preview" id="preview">
    <div class="stage" id="stage">
      <canvas id="view" width="640" height="360"></canvas>
      <div id="crop" hidden></div>
    </div>
    <div id="hint">
      <div>Drop an image or video</div>
      <button type="button" id="openBtn">Open</button>
    </div>
    <button type="button" id="originalBtn">Original</button>
    <input id="file" type="file" hidden accept="image/jpeg,image/png,image/heic,image/heif,.jpg,.jpeg,.png,.heic,.heif,video/mp4,video/quicktime,.mp4,.mov">
  </div>
  <aside class="side">
    <div class="group">
      <div class="row">
        <button type="button" id="randomiseBtn">Randomise</button>
        <button type="button" id="surpriseBtn">Surprise me</button>
        <button type="button" id="playBtn">Play</button>
      </div>
      <div class="field">
        <label for="seedInput">Seed</label>
        <input id="seedInput" type="number" min="0" max="4294967295" step="1" value="1">
        <span></span>
      </div>
      <div class="field">
        <label for="loopInput">Loop</label>
        <input id="loopInput" type="range" min="1" max="6" step="0.1" value="2">
        <span id="loopVal">2.0s</span>
      </div>
      <div class="field">
        <label for="fpsInput">FPS</label>
        <input id="fpsInput" type="range" min="10" max="30" step="1" value="12">
        <span id="fpsVal">12</span>
      </div>
    </div>
    <div class="group">
      <div class="row">
        <input id="presetName" type="text" placeholder="Preset name" maxlength="40" style="flex:1">
        <button type="button" id="presetSave">Save</button>
      </div>
      <div class="row">
        <select id="presetSelect" style="flex:1"><option value="">Presets</option></select>
        <button type="button" id="presetLoad">Load</button>
        <button type="button" id="presetDelete">Delete</button>
      </div>
      <div class="row">
        <button type="button" id="presetExport">Export JSON</button>
        <button type="button" id="presetImportBtn">Import JSON</button>
        <input id="presetImport" type="file" hidden accept="application/json,.json">
      </div>
    </div>
    <div id="stack"></div>
  </aside>
</div>
<footer>
  <button type="button" class="primary" id="exportPng">PNG</button>
  <button type="button" id="exportJpg">JPEG</button>
  <div class="field" style="width:180px;margin:0">
    <label for="jpgQuality">Quality</label>
    <input id="jpgQuality" type="range" min="0.5" max="0.98" step="0.01" value="0.92">
    <span id="jpgVal">92%</span>
  </div>
  <button type="button" id="exportGif">GIF</button>
  <label class="muted" for="gifWidth">Width</label>
  <input id="gifWidth" type="number" min="32" max="1920" step="1" value="800" style="width:5em">
  <span id="gifEst" class="muted"></span>
  <button type="button" id="exportMp4">MP4</button>
  <label class="muted"><input id="squareCrop" type="checkbox"> Square crop</label>
  <button type="button" id="undoBtn">Undo</button>
  <button type="button" id="redoBtn">Redo</button>
  <span class="spacer"></span>
  <span class="keys">Space original · R seed · S PNG · ⌘Z undo</span>
  <span id="status" role="status"></span>
</footer>
<canvas id="sink" width="2" height="2"></canvas>
<video id="vid" muted playsinline loop></video>
<script>
'use strict';
(function () {
  var BLENDS = ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten', 'difference'];
  var BLEND_INDEX = { normal: 0, multiply: 1, screen: 2, overlay: 3, darken: 4, lighten: 5, difference: 6 };
  var SALTS = {
    datamosh: 1, jpeg: 2, shuffle: 3, slice: 4, smear: 5, sort: 6, wave: 7,
    rgb: 8, mosaic: 9, crush: 10, duo: 11, panel: 12, grain: 13, scan: 14, vignette: 15,
    tex0: 21, tex1: 22, tex2: 23, tex3: 24
  };

  function def(id, name, params, controls, extra) {
    var d = { id: id, name: name, params: params, controls: controls };
    if (extra) {
      for (var k in extra) d[k] = extra[k];
    }
    return d;
  }
  var pct = function (v) { return Math.round(v * 100) + '%'; };
  var deg = function (v) { return Math.round(v) + '°'; };
  var n1 = function (v) { return String(Math.round(v * 100) / 100); };
  var VIGNETTE_MAX = 2;
  var VIGNETTE_SIZE = 0.35;
  var VIGNETTE_SOFT = 0.8;

  var DEFS = [
    def('datamosh', 'Datamosh', { amount: 0.35, block: 0.06 }, [
      { k: 'amount', label: 'Amount', min: 0, max: 1, step: 0.01, fmt: pct },
      { k: 'block', label: 'Block', min: 0.02, max: 0.25, step: 0.005, fmt: pct }
    ], { videoOnly: true }),
    def('jpeg', 'JPEG corruption', { bytes: 24, quality: 0.55, seed: 1 }, [
      { k: 'bytes', label: 'Bytes', min: 1, max: 400, step: 1, fmt: function (v) { return String(Math.round(v)); } },
      { k: 'quality', label: 'Quality', min: 0.2, max: 0.95, step: 0.01, fmt: pct },
      { k: 'seed', label: 'Seed', type: 'number', min: 0, max: 99999, step: 1 }
    ], { cpu: true }),
    def('shuffle', 'Block shuffle', { block: 0.08, count: 12 }, [
      { k: 'block', label: 'Block', min: 0.02, max: 0.3, step: 0.005, fmt: pct },
      { k: 'count', label: 'Count', min: 1, max: 48, step: 1, fmt: function (v) { return String(Math.round(v)); } }
    ]),
    def('slice', 'Slice shift', { minH: 0.012, maxH: 0.045, shift: 0.06, density: 0.75 }, [
      { k: 'minH', label: 'Min strip', min: 0.002, max: 0.08, step: 0.001, fmt: pct },
      { k: 'maxH', label: 'Max strip', min: 0.004, max: 0.2, step: 0.001, fmt: pct },
      { k: 'shift', label: 'Shift', min: 0, max: 0.35, step: 0.005, fmt: pct },
      { k: 'density', label: 'Density', min: 0, max: 1, step: 0.01, fmt: pct }
    ]),
    def('smear', 'Row smear', { probability: 0.18 }, [
      { k: 'probability', label: 'Probability', min: 0, max: 1, step: 0.01, fmt: pct }
    ]),
    def('sort', 'Pixel sort', { low: 40, high: 210, direction: 'h' }, [
      { k: 'low', label: 'Low', min: 0, max: 255, step: 1, fmt: function (v) { return String(Math.round(v)); } },
      { k: 'high', label: 'High', min: 0, max: 255, step: 1, fmt: function (v) { return String(Math.round(v)); } },
      { k: 'direction', label: 'Direction', type: 'select', options: [['h', 'Horizontal'], ['v', 'Vertical']] }
    ], { cpu: true }),
    def('wave', 'Wave distortion', { amp: 0.015, wavelength: 0.14, phase: 0 }, [
      { k: 'amp', label: 'Amplitude', min: 0, max: 0.08, step: 0.001, fmt: pct },
      { k: 'wavelength', label: 'Wavelength', min: 0.01, max: 0.8, step: 0.005, fmt: pct },
      { k: 'phase', label: 'Phase', min: 0, max: 360, step: 1, fmt: deg }
    ]),
    def('rgb', 'RGB split', { amount: 0.018, angle: 18 }, [
      { k: 'amount', label: 'Amount', min: 0, max: 0.12, step: 0.001, fmt: pct },
      { k: 'angle', label: 'Angle', min: 0, max: 360, step: 1, fmt: deg }
    ]),
    def('mosaic', 'Mosaic', { block: 0.018 }, [
      { k: 'block', label: 'Block', min: 0.002, max: 0.12, step: 0.001, fmt: pct }
    ]),
    def('crush', 'Bit crush', { levels: 5 }, [
      { k: 'levels', label: 'Levels', min: 2, max: 32, step: 1, fmt: function (v) { return String(Math.round(v)); } }
    ]),
    def('duo', 'Duotone', { shadow: '#142033', highlight: '#f2c14e', mix: 0.9 }, [
      { k: 'shadow', label: 'Shadow', type: 'color' },
      { k: 'highlight', label: 'Highlight', type: 'color' },
      { k: 'mix', label: 'Mix', min: 0, max: 1, step: 0.01, fmt: pct }
    ]),
    def('panel', 'Colour panel', { blocks: 1, x: 0.08, y: 0.14, w: 0.28, h: 0.22, color: '#ff3b6a', blend: 'normal' }, [
      { k: 'blocks', label: 'Blocks', min: 1, max: 3, step: 1, fmt: function (v) { return String(Math.round(v)); } },
      { k: 'x', label: 'X', min: 0, max: 1, step: 0.01, fmt: pct },
      { k: 'y', label: 'Y', min: 0, max: 1, step: 0.01, fmt: pct },
      { k: 'w', label: 'Width', min: 0.02, max: 1, step: 0.01, fmt: pct },
      { k: 'h', label: 'Height', min: 0.02, max: 1, step: 0.01, fmt: pct },
      { k: 'color', label: 'Colour', type: 'color' },
      { k: 'blend', label: 'Blend', type: 'select', options: BLENDS.map(function (b) { return [b, b[0].toUpperCase() + b.slice(1)]; }) }
    ]),
    def('grain', 'Grain', { amount: 0.28, mono: 1 }, [
      { k: 'amount', label: 'Amount', min: 0, max: 1, step: 0.01, fmt: pct },
      { k: 'mono', label: 'Mono', type: 'check' }
    ]),
    def('scan', 'Scanlines', { spacing: 0.006, darkness: 0.45 }, [
      { k: 'spacing', label: 'Spacing', min: 0.002, max: 0.04, step: 0.001, fmt: pct },
      { k: 'darkness', label: 'Darkness', min: 0, max: 1, step: 0.01, fmt: pct }
    ]),
    def('vignette', 'Vignette', { amount: 0.55, size: VIGNETTE_SIZE, softness: VIGNETTE_SOFT }, [
      { k: 'amount', label: 'Strength', min: 0, max: VIGNETTE_MAX, step: 0.01, fmt: pct },
      { k: 'size', label: 'Size', min: 0, max: 1.2, step: 0.01, fmt: pct },
      { k: 'softness', label: 'Softness', min: 0, max: 1.6, step: 0.01, fmt: pct }
    ])
  ];

  function cloneParams(p) {
    var o = {};
    for (var k in p) o[k] = p[k];
    return o;
  }

  function makeLayers() {
    var layers = DEFS.map(function (d) {
      return {
        id: d.id,
        name: d.name,
        cpu: !!d.cpu,
        videoOnly: !!d.videoOnly,
        texture: false,
        slot: -1,
        enabled: false,
        opacity: 1,
        animate: false,
        fileName: '',
        params: cloneParams(d.params)
      };
    });
    for (var i = 0; i < 4; i++) {
      layers.push({
        id: 'tex' + i,
        name: 'Texture ' + (i + 1),
        cpu: false,
        videoOnly: false,
        texture: true,
        slot: i,
        enabled: false,
        opacity: 0.55,
        animate: false,
        fileName: '',
        params: { blend: 'multiply', scale: 'cover' }
      });
    }
    return layers;
  }

  var state = {
    seed: 1,
    loopLength: 2,
    fps: 12,
    frame: 0,
    playing: false,
    showOriginal: false,
    busy: false,
    exporting: false,
    kind: null,
    image: null,
    mediaW: 0,
    mediaH: 0,
    objectUrl: '',
    crop: { square: false, nx: 0.5, ny: 0.5 },
    layers: makeLayers()
  };

  var textureSlots = [null, null, null, null];
  var undoStack = [];
  var redoStack = [];
  var historyLock = false;
  var previewW = 640;
  var previewH = 360;
  var playStart = 0;
  var datamoshStamp = 0;
  var appliedStamp = -1;
  var hasPrev = false;
  var jpegCache = null;

  var view = document.getElementById('view');
  var sink = document.getElementById('sink');
  var sinkCtx = sink.getContext('2d', { alpha: false });
  var video = document.getElementById('vid');
  var stackEl = document.getElementById('stack');
  var hint = document.getElementById('hint');
  var cropEl = document.getElementById('crop');
  var statusEl = document.getElementById('status');
  var previewEl = document.getElementById('preview');
  var fileInput = document.getElementById('file');
  var seedInput = document.getElementById('seedInput');
  var loopInput = document.getElementById('loopInput');
  var fpsInput = document.getElementById('fpsInput');
  var loopVal = document.getElementById('loopVal');
  var fpsVal = document.getElementById('fpsVal');
  var playBtn = document.getElementById('playBtn');
  var squareCrop = document.getElementById('squareCrop');
  var gifWidthInput = document.getElementById('gifWidth');
  var gifEst = document.getElementById('gifEst');
  var jpgQuality = document.getElementById('jpgQuality');
  var jpgVal = document.getElementById('jpgVal');
  var undoBtn = document.getElementById('undoBtn');
  var redoBtn = document.getElementById('redoBtn');
  var originalBtn = document.getElementById('originalBtn');
  var presetSelect = document.getElementById('presetSelect');

  var sourceCanvas = document.createElement('canvas');
  var sourceCtx = sourceCanvas.getContext('2d', { alpha: false });
  var workCanvas = document.createElement('canvas');
  var workCtx = workCanvas.getContext('2d', { alpha: false });

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function frameCount() { return Math.max(1, Math.round(state.loopLength * state.fps)); }

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashSeed(base, frame, salt) {
    var x = (base >>> 0) ^ Math.imul(frame + 1, 0x9E3779B1) ^ Math.imul(salt, 0x85EBCA6B);
    x = Math.imul(x ^ (x >>> 16), 0x7FEB352D);
    x = Math.imul(x ^ (x >>> 15), 0x846CA68B);
    return (x ^ (x >>> 16)) >>> 0;
  }
  function phaseOf(frame, animOn, layer) {
    if (!(animOn && layer.animate)) return 0;
    var n = frameCount();
    return ((frame % n) / n) * Math.PI * 2;
  }
  function effectSeed(layer, frame, animOn) {
    var fr = (animOn && layer.animate) ? (frame % frameCount()) : 0;
    var local = (layer.params.seed | 0) >>> 0;
    return hashSeed(state.seed ^ local, fr, SALTS[layer.id] || 1);
  }
  function hexToRgb01(hex) {
    var n = parseInt(String(hex).replace('#', ''), 16);
    if (!isFinite(n)) n = 0;
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    var a = s * Math.min(l, 1 - l);
    function f(n) {
      var k = (n + h / 30) % 12;
      var c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * clamp(c, 0, 1)).toString(16).padStart(2, '0');
    }
    return '#' + f(0) + f(8) + f(4);
  }

  function tune(layer, w, h, frame, animOn) {
    var p = layer.params;
    var ph = phaseOf(frame, animOn, layer);
    var s = Math.sin(ph);
    var seed = effectSeed(layer, frame, animOn);
    var minD = Math.min(w, h);
    switch (layer.id) {
      case 'rgb':
        return { amount: Math.max(0, p.amount * (1 + 0.85 * s)) * minD, angle: p.angle * Math.PI / 180 + ph, seed: seed };
      case 'slice':
        return { minH: p.minH, maxH: Math.max(p.minH, p.maxH), shift: p.shift, density: p.density, seed: seed };
      case 'wave':
        return {
          amp: Math.max(0, p.amp * (1 + 0.35 * s)) * w,
          wavelength: Math.max(2, p.wavelength * h),
          phase: p.phase * Math.PI / 180 + ph,
          seed: seed
        };
      case 'sort':
        return { low: clamp(p.low + 28 * s, 0, 255), high: clamp(p.high + 28 * s, 0, 255), direction: p.direction, seed: seed };
      case 'jpeg':
        return { bytes: Math.round(p.bytes), quality: p.quality, seed: seed };
      case 'scan':
        return { spacing: Math.max(2, p.spacing * h), darkness: p.darkness, offset: ph / (Math.PI * 2), seed: seed };
      case 'duo':
        return { shadow: p.shadow, highlight: p.highlight, mix: clamp(p.mix * (1 + 0.2 * s), 0, 1), seed: seed };
      case 'crush':
        return { levels: Math.max(2, Math.round(p.levels * (1 + 0.45 * s))), seed: seed };
      case 'mosaic':
        return { block: Math.max(1, p.block * (1 + 0.4 * s) * minD), seed: seed };
      case 'grain':
        return { amount: p.amount, mono: p.mono ? 1 : 0, seed: seed };
      case 'panel':
        return {
          x: p.x + 0.08 * s,
          y: p.y + 0.05 * Math.sin(ph * 2),
          w: p.w,
          h: p.h,
          color: p.color,
          blend: p.blend,
          blocks: clamp(Math.round(p.blocks == null ? 1 : p.blocks), 1, 3),
          seed: seed
        };
      case 'shuffle':
        return { block: Math.max(2, Math.round(p.block * minD)), count: Math.round(p.count), seed: seed };
      case 'smear':
        return { probability: p.probability, seed: seed };
      case 'vignette':
        var vAmt = (typeof p.amount === 'number' && isFinite(p.amount)) ? p.amount : 0.55;
        var vCap = vAmt <= 1 ? 1 : VIGNETTE_MAX;
        return {
          amount: clamp(vAmt * (1 + 0.35 * s), 0, vCap),
          size: clamp(typeof p.size === 'number' ? p.size : VIGNETTE_SIZE, 0, 1.2),
          softness: clamp(typeof p.softness === 'number' ? p.softness : VIGNETTE_SOFT, 0, 1.6),
          seed: seed
        };
      case 'datamosh':
        return { amount: clamp(p.amount * (1 + 0.25 * s), 0, 1), block: Math.max(2, p.block * minD), seed: seed };
      default:
        return { seed: seed };
    }
  }

  function setStatus(msg, warn) {
    statusEl.textContent = msg || '';
    statusEl.className = warn ? 'warn' : '';
  }

  function snapshot() {
    return JSON.stringify({
      seed: state.seed,
      loopLength: state.loopLength,
      fps: state.fps,

      } else {
        var meta = null;
        for (var di = 0; di < DEFS.length; di++) if (DEFS[di].id === layer.id) meta = DEFS[di];
        (meta.controls || []).forEach(function (ctl) { addControl(body, layer, ctl); });
      }
      card.appendChild(body);
      wireDrag(handle, card);
      stackEl.appendChild(card);
    });
  }
  function fieldRow(label, input, valueEl) {
    var row = document.createElement('div');
    row.className = 'field';
    var lab = document.createElement('label');
    lab.textContent = label;
    row.appendChild(lab);
    row.appendChild(input);
    row.appendChild(valueEl);
    return row;
  }
  function addControl(body, layer, ctl) {
    if (ctl.type === 'color') {
      var input = document.createElement('input');
      input.type = 'color';
      input.value = layer.params[ctl.k];
      var span = document.createElement('span');
      span.textContent = layer.params[ctl.k];
      body.appendChild(fieldRow(ctl.label, input, span));
      track(input, function () {
        layer.params[ctl.k] = input.value;
        span.textContent = input.value;
      });
      return;
    }
    if (ctl.type === 'check') {
      var box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!layer.params[ctl.k];
      var span2 = document.createElement('span');
      span2.textContent = '';
      body.appendChild(fieldRow(ctl.label, box, span2));
      track(box, function () { layer.params[ctl.k] = box.checked ? 1 : 0; });
      return;
    }
    if (ctl.type === 'select') {
      addSelect(body, layer, ctl.k, ctl.label, ctl.options);
      return;
    }
    if (ctl.type === 'number') {
      var num = document.createElement('input');
      num.type = 'number';
      num.min = String(ctl.min);
      num.max = String(ctl.max);
      num.step = String(ctl.step);
      num.value = String(layer.params[ctl.k]);
      var span3 = document.createElement('span');
      span3.textContent = '';
      body.appendChild(fieldRow(ctl.label, num, span3));
      track(num, function () { layer.params[ctl.k] = clamp(parseInt(num.value, 10) || 0, ctl.min, ctl.max); });
      return;
    }
    var range = document.createElement('input');
    range.type = 'range';
    range.min = String(ctl.min);
    range.max = String(ctl.max);
    range.step = String(ctl.step);
    range.value = String(layer.params[ctl.k]);
    var span4 = document.createElement('span');
    span4.textContent = ctl.fmt ? ctl.fmt(layer.params[ctl.k]) : n1(layer.params[ctl.k]);
    body.appendChild(fieldRow(ctl.label, range, span4));
    track(range, function () {
      layer.params[ctl.k] = parseFloat(range.value);
      span4.textContent = ctl.fmt ? ctl.fmt(layer.params[ctl.k]) : n1(layer.params[ctl.k]);
    });
  }
  function addSelect(body, layer, key, label, options) {
    var sel = document.createElement('select');
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt[0];
      o.textContent = opt[1];
      if (layer.params[key] === opt[0]) o.selected = true;
      sel.appendChild(o);
    });
    var span = document.createElement('span');
    span.textContent = '';
    body.appendChild(fieldRow(label, sel, span));
    track(sel, function () { layer.params[key] = sel.value; });
  }
  function wireDrag(handle, card) {
    handle.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      e.preventDefault();
      var before = snapshot();
      handle.setPointerCapture(e.pointerId);
      card.classList.add('dragging');
      function move(ev) {
        var cards = Array.prototype.slice.call(stackEl.children);
        var after = null;
        for (var i = 0; i < cards.length; i++) {
          if (cards[i] === card) continue;
          var r = cards[i].getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) { after = cards[i]; break; }
        }
        if (after) stackEl.insertBefore(card, after);
        else stackEl.appendChild(card);
      }
      function up() {
        card.classList.remove('dragging');
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        syncOrderFromDOM();
        if (before !== snapshot()) pushSnapshot(before);
        requestRender();
      }
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
    });
  }
  function syncOrderFromDOM() {
    var ids = Array.prototype.map.call(stackEl.children, function (el) { return el.dataset.id; });
    var inDom = {};
    ids.forEach(function (id) { inDom[id] = true; });
    var ordered = ids.map(function (id) {
      for (var i = 0; i < state.layers.length; i++) if (state.layers[i].id === id) return state.layers[i];
      return null;
    }).filter(Boolean);
    var hidden = [];
    state.layers.forEach(function (layer, index) {
      if (!inDom[layer.id]) hidden.push({ layer: layer, index: index });
    });
    hidden.sort(function (a, b) { return b.index - a.index; });
    var next = ordered.slice();
    hidden.forEach(function (item) {
      next.splice(Math.min(item.index, next.length), 0, item.layer);
    });
    state.layers = next;
  }

  function loadTexture(slot, file, nameEl, layer) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      textureSlots[slot] = { img: img, fileName: file.name };
      layer.fileName = file.name;
      layer.enabled = true;
      if (nameEl) nameEl.textContent = file.name;
      gl.bindTexture(gl.TEXTURE_2D, overlayTex[slot]);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, img);
      buildStack();
      requestRender();
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus('Could not decode that texture', true);
    };
    img.src = url;
  }

  function onMediaReady() {
    var p = previewDimensions(state.mediaW, state.mediaH);
    previewW = p.w;
    previewH = p.h;
    view.width = previewW;
    view.height = previewH;
    hint.hidden = true;
    state.frame = 0;
    hasPrev = false;
    appliedStamp = -1;
    jpegCache = null;
    buildStack();
    syncGlobals();
    setStatus(state.mediaW + '×' + state.mediaH);
    requestRender();
  }
  function loadImage(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        state.image = img;
        state.kind = 'image';
        state.mediaW = img.naturalWidth;
        state.mediaH = img.naturalHeight;
        onMediaReady();
        resolve();
      };
      img.onerror = function () { reject(new Error('Could not decode that image')); };
      img.src = url;
    });
  }
  function loadVideo(url) {
    return new Promise(function (resolve, reject) {
      function ok() {
        video.removeEventListener('loadeddata', ok);
        video.onerror = null;
        state.image = null;
        state.kind = 'video';
        state.mediaW = video.videoWidth;
        state.mediaH = video.videoHeight;
        onMediaReady();
        video.play().catch(function () {});
        watchVideo();
        resolve();
      }
      video.addEventListener('loadeddata', ok);
      video.onerror = function () { reject(new Error('Could not decode that video')); };
      video.src = url;
      video.load();
    });
  }
  var watching = false;
  function watchVideo() {
    if (watching) return;
    watching = true;
    if (typeof video.requestVideoFrameCallback === 'function') {
      var step = function () {
        if (state.kind === 'video' && !state.exporting && !video.paused) {
          datamoshStamp++;
          if (state.playing) state.frame = Math.floor(video.currentTime * state.fps) % frameCount();
          requestRender();
        }
        if (watching) video.requestVideoFrameCallback(step);
      };
      video.requestVideoFrameCallback(step);
    }
  }
  function loadFile(file) {
    if (!file || state.busy) return;
    var name = (file.name || '').toLowerCase();
    var type = (file.type || '').toLowerCase();
    var isVideo = type.indexOf('video/') === 0 || name.endsWith('.mp4') || name.endsWith('.mov') || name.endsWith('.m4v');
    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
    var url = URL.createObjectURL(file);
    state.objectUrl = url;
    state.playing = false;
    playBtn.textContent = 'Play';
    var job = isVideo ? loadVideo(url) : (function () {
      video.pause();
      video.removeAttribute('src');
      video.load();
      return loadImage(url);
    })();
    job.catch(function (err) {
      setStatus(err.message || 'Could not open that file', true);
    });
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
  function randomiseParams(layer) {
    var p = layer.params;
    switch (layer.id) {
      case 'rgb': p.amount = rand(0.004, 0.04); p.angle = rand(0, 360); break;
      case 'slice': p.minH = rand(0.006, 0.02); p.maxH = rand(p.minH + 0.01, 0.08); p.shift = rand(0.02, 0.1); p.density = rand(0.35, 0.9); break;
      case 'wave': p.amp = rand(0.004, 0.03); p.wavelength = rand(0.05, 0.35); p.phase = rand(0, 360); break;
      case 'sort': p.low = rand(15, 90); p.high = rand(150, 240); p.direction = pick(['h', 'v']); break;
      case 'jpeg': p.bytes = Math.round(rand(6, 48)); p.quality = rand(0.35, 0.8); p.seed = Math.floor(rand(0, 9999)); break;
      case 'scan': p.spacing = rand(0.003, 0.012); p.darkness = rand(0.25, 0.7); break;
      case 'duo':
        p.shadow = hslToHex(rand(0, 360), rand(30, 70), rand(8, 22));
        p.highlight = hslToHex(rand(0, 360), rand(50, 90), rand(55, 78));
        p.mix = rand(0.45, 1);
        break;
      case 'crush': p.levels = Math.round(rand(3, 14)); break;
      case 'mosaic': p.block = rand(0.006, 0.035); break;
      case 'grain': p.amount = rand(0.08, 0.4); p.mono = Math.random() < 0.5 ? 1 : 0; break;
      case 'panel':
        p.blocks = 1 + Math.floor(rand(0, 3));
        p.x = rand(0, 0.7); p.y = rand(0, 0.7); p.w = rand(0.12, 0.4); p.h = rand(0.08, 0.35);
        p.color = hslToHex(rand(0, 360), rand(60, 90), rand(45, 65));
        p.blend = pick(BLENDS);
        break;
      case 'shuffle': p.block = rand(0.04, 0.14); p.count = Math.round(rand(4, 20)); break;
      case 'smear': p.probability = rand(0.05, 0.3); break;
      case 'vignette':
        p.amount = rand(0.3, 1.6);
        p.size = rand(0.1, 0.7);
        p.softness = rand(0.2, 1.2);
        break;
      case 'datamosh': p.amount = rand(0.15, 0.55); p.block = rand(0.04, 0.12); break;
      default: break;
    }
  }
  function randomise() {
    pushSnapshot(snapshot());
    state.seed = (Math.random() * 4294967296) >>> 0;
    jpegCache = null;
    syncGlobals();
    requestRender();
  }
  function surprise() {
    pushSnapshot(snapshot());
    state.seed = (Math.random() * 4294967296) >>> 0;
    jpegCache = null;
    state.layers.forEach(function (layer) {
      if (layer.texture) {
        if (textureSlots[layer.slot]) {
          layer.enabled = Math.random() < 0.5;
          layer.opacity = rand(0.35, 0.85);
          layer.animate = layer.enabled && Math.random() < 0.25;
          layer.params.blend = pick(BLENDS);
          layer.params.scale = pick(['cover', 'fit', 'tile']);
        }
        return;
      }
      if (layer.videoOnly && state.kind !== 'video') { layer.enabled = false; return; }
      var heavy = layer.id === 'jpeg' || layer.id === 'sort';
      layer.enabled = Math.random() < (heavy ? 0.3 : 0.45);
      layer.opacity = rand(0.7, 1);
      layer.animate = layer.enabled && Math.random() < (layer.id === 'jpeg' ? 0.12 : 0.34);
      randomiseParams(layer);
    });
    var pool = state.layers.filter(function (l) { return !l.texture && !(l.videoOnly && state.kind !== 'video'); });
    var guard = 0;
    while (state.layers.filter(function (l) { return l.enabled && !l.texture; }).length < 2 && guard < 8) {
      var layer = pool[Math.floor(Math.random() * pool.length)];
      layer.enabled = true;
      layer.opacity = rand(0.75, 1);
      guard++;
    }
    syncGlobals();
    buildStack();
    requestRender();
  }

  function presetStore() {
    try { return JSON.parse(localStorage.getItem('glitch-presets-v1') || '{}'); }
    catch (e) { return {}; }
  }
  function writePresetStore(obj) {
    localStorage.setItem('glitch-presets-v1', JSON.stringify(obj));
  }
  function currentPreset(name) {
    return {
      format: 'glitch-preset',
      version: 1,
      name: name || '',
      seed: state.seed,
      loopLength: state.loopLength,
      fps: state.fps,
      crop: { square: state.crop.square, nx: state.crop.nx, ny: state.crop.ny },
      layers: state.layers.map(function (l) {
        return {
          id: l.id,
          enabled: l.enabled,
          opacity: l.opacity,
          animate: l.animate,
          fileName: l.texture ? (l.fileName || '') : '',
          params: cloneParams(l.params)
        };
      })
    };
  }
  function refreshPresets() {
    var cur = presetSelect.value;
    var store = presetStore();
    presetSelect.textContent = '';
    var empty = document.createElement('option');
    empty.value = '';
    empty.textContent = 'Presets';
    presetSelect.appendChild(empty);
    Object.keys(store).sort().forEach(function (name) {
      var o = document.createElement('option');
      o.value = name;
      o.textContent = name;
      presetSelect.appendChild(o);
    });
    if (cur && store[cur]) presetSelect.value = cur;
  }
  function applyPreset(data) {
    pushSnapshot(snapshot());
    restore(JSON.stringify(data));
    var missing = [];
    state.layers.forEach(function (l) {
      if (!l.texture || !l.fileName) return;
      var slot = textureSlots[l.slot];
      if (!slot || slot.fileName !== l.fileName) missing.push(l.fileName);
    });
    if (missing.length) setStatus('Load texture: ' + missing[0], true);
    else setStatus('Loaded preset');
  }
  function savePreset() {
    var name = document.getElementById('presetName').value.replace(/^\s+|\s+$/g, '');
    if (!name) { setStatus('Name the preset', true); return; }
    var store = presetStore();
    store[name] = currentPreset(name);
    writePresetStore(store);
    refreshPresets();
    presetSelect.value = name;
    setStatus('Saved preset');
  }
  function loadPreset() {
    var name = presetSelect.value;
    if (!name) return;
    var store = presetStore();
    if (!store[name]) return;
    applyPreset(store[name]);
  }
  function deletePreset() {
    var name = presetSelect.value;
    if (!name) return;
    var store = presetStore();
    delete store[name];
    writePresetStore(store);
    refreshPresets();
    setStatus('Deleted preset');
  }

  function typingTarget(el) {
    if (!el) return false;
    var tag = el.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    return !!el.isContentEditable;
  }
  var spaceDown = false;

  function bind() {
    document.getElementById('openBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      var file = fileInput.files && fileInput.files[0];
      if (file) loadFile(file);
      fileInput.value = '';
    });
    previewEl.addEventListener('dragover', function (e) {
      e.preventDefault();
      previewEl.classList.add('over');
    });
    previewEl.addEventListener('dragleave', function () { previewEl.classList.remove('over'); });
    previewEl.addEventListener('drop', function (e) {
      e.preventDefault();
      previewEl.classList.remove('over');
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) loadFile(file);
    });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop', function (e) { e.preventDefault(); });

    document.getElementById('randomiseBtn').addEventListener('click', randomise);
    document.getElementById('surpriseBtn').addEventListener('click', surprise);
    playBtn.addEventListener('click', function () {
      if (!state.kind) return;
      state.playing = !state.playing;
      playBtn.textContent = state.playing ? 'Stop' : 'Play';
      if (state.playing) {
        playStart = performance.now();
        state.frame = 0;
      } else {
        state.frame = 0;
      }
      requestRender();
    });
    track(seedInput, function () {
      state.seed = (parseInt(seedInput.value, 10) || 0) >>> 0;
      jpegCache = null;
    });
    track(loopInput, function () {
      state.loopLength = clamp(parseFloat(loopInput.value), 1, 6);
      loopVal.textContent = state.loopLength.toFixed(1) + 's';
      updateGifEst();
    });
    track(fpsInput, function () {
      state.fps = clamp(parseInt(fpsInput.value, 10) || 12, 10, 30);
      fpsVal.textContent = String(state.fps);
      updateGifEst();
    });
    track(squareCrop, function () {
      state.crop.square = squareCrop.checked;
      layoutCrop();
    });
    jpgQuality.addEventListener('input', function () {
      jpgVal.textContent = Math.round(parseFloat(jpgQuality.value) * 100) + '%';
    });
    gifWidthInput.addEventListener('input', updateGifEst);

    document.getElementById('presetSave').addEventListener('click', savePreset);
    document.getElementById('presetLoad').addEventListener('click', loadPreset);
    document.getElementById('presetDelete').addEventListener('click', deletePreset);
    document.getElementById('presetExport').addEventListener('click', function () {
      var name = presetSelect.value || document.getElementById('presetName').value || 'preset';
      var blob = new Blob([JSON.stringify(currentPreset(name), null, 2)], { type: 'application/json' });
      var safe = String(name).replace(/[^a-z0-9-_]+/gi, '-') || 'preset';
      var a = document.createElement('a');
      var url = URL.createObjectURL(blob);
      a.href = url;
      a.download = 'glitch-preset-' + safe + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    });
    document.getElementById('presetImportBtn').addEventListener('click', function () {
      document.getElementById('presetImport').click();
    });
    document.getElementById('presetImport').addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      file.text().then(function (text) {
        var data = JSON.parse(text);
        if (!data || data.format !== 'glitch-preset' || !data.layers) throw new Error('Not a glitch preset');
        applyPreset(data);
      }).catch(function () { setStatus('Could not read that preset', true); });
    });

    document.getElementById('exportPng').addEventListener('click', function () { exportStill('image/png'); });
    document.getElementById('exportJpg').addEventListener('click', function () { exportStill('image/jpeg'); });
    document.getElementById('exportGif').addEventListener('click', exportGif);
    document.getElementById('exportMp4').addEventListener('click', exportMp4);
    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    function hold(on) {
      state.showOriginal = on;
      originalBtn.classList.toggle('on', on);
      requestRender();
    }
    originalBtn.addEventListener('pointerdown', function (e) {
      originalBtn.setPointerCapture(e.pointerId);
      hold(true);
    });
    originalBtn.addEventListener('pointerup', function () { hold(false); });
    originalBtn.addEventListener('pointercancel', function () { hold(false); });

    cropEl.addEventListener('pointerdown', function (e) {
      if (!state.crop.square) return;
      e.preventDefault();
      var before = snapshot();
      cropEl.setPointerCapture(e.pointerId);
      var startX = e.clientX;
      var startY = e.clientY;
      var startNX = state.crop.nx;
      var startNY = state.crop.ny;
      function move(ev) {
        var rect = view.getBoundingClientRect();
        state.crop.nx = startNX + (ev.clientX - startX) / rect.width;
        state.crop.ny = startNY + (ev.clientY - startY) / rect.height;
        layoutCrop();
      }
      function up() {
        cropEl.removeEventListener('pointermove', move);
        cropEl.removeEventListener('pointerup', up);
        if (before !== snapshot()) pushSnapshot(before);
      }
      cropEl.addEventListener('pointermove', move);
      cropEl.addEventListener('pointerup', up);
    });

    window.addEventListener('keydown', function (e) {
      if (typingTarget(e.target)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        if (!spaceDown) { spaceDown = true; hold(true); }
        return;
      }
      if (e.metaKey || e.ctrlKey || e.altKey) {
        if ((e.key === 'z' || e.key === 'Z') && !e.altKey) {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        } else if (e.key === 'y' || e.key === 'Y') {
          e.preventDefault();
          redo();
        }
        return;
      }
      if (e.repeat) return;
      if (e.code === 'KeyR') randomise();
      if (e.code === 'KeyS') { e.preventDefault(); exportStill('image/png'); }
    });
    window.addEventListener('keyup', function (e) {
      if (e.code === 'Space') {
        spaceDown = false;
        if (!typingTarget(e.target)) hold(false);
      }
    });
    window.addEventListener('blur', function () {
      spaceDown = false;
      if (state.showOriginal) hold(false);
    });
    window.addEventListener('error', function (e) { setStatus(e.message || 'Something went wrong', true); });
    window.addEventListener('unhandledrejection', function (e) {
      var msg = e.reason && e.reason.message ? e.reason.message : 'Something went wrong';
      setStatus(msg, true);
    });

    function tick(now) {
      if (state.playing && state.kind === 'image' && !state.exporting) {
        var n = frameCount();
        var fi = Math.floor((now - playStart) / 1000 * state.fps) % n;
        if (fi !== state.frame) {
          state.frame = fi;
          requestRender();
        }
      }
      if (state.kind === 'video' && !video.paused && !state.exporting && typeof video.requestVideoFrameCallback !== 'function') {
        datamoshStamp++;
        if (state.playing) state.frame = Math.floor(video.currentTime * state.fps) % frameCount();
        requestRender();
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
    if (typeof ResizeObserver === 'function') {
      new ResizeObserver(function () { layoutCrop(); }).observe(view);
    }
  }

  try { initGL(); }
  catch (err) { setStatus(err.message || 'WebGL2 failed', true); }
  buildStack();
  syncGlobals();
  bind();
  setStatus('Open an image or video');
})();
</script>
</body>
</html>
